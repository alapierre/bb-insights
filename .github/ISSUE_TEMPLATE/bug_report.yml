name: Bug report
description: Something isn't working as expected
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please do **not** use
        this form for security vulnerabilities - see
        [SECURITY.md](https://github.com/alapierre/bb-insights/blob/master/SECURITY.md)
        instead.

  - type: input
    id: version
    attributes:
      label: bb-insights version
      description: Output of `bb-insights --version`, or the Docker image tag used.
      placeholder: v1.2.3
    validations:
      required: true

  - type: dropdown
    id: report-type
    attributes:
      label: Report type / subcommand
      description: Which subcommand or report format is affected?
      options:
        - tests (JUnit)
        - coverage (Go coverage.out)
        - jacoco
        - trivy
        - sarif
        - other / not report-specific
    validations:
      required: true

  - type: dropdown
    id: invocation
    attributes:
      label: How was bb-insights invoked?
      options:
        - Binary / CLI flags
        - Docker image as a script step
        - Bitbucket Pipe (BB_INSIGHTS_REPORT_TYPE env mode)
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug, including the exact error message if any.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: >
        Command line invocation (or pipeline step config) used, and if
        possible, a minimal or redacted sample of the input report
        (coverage.out, JUnit XML, SARIF, ...) that triggers the issue.
      render: shell
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant output / logs
      description: >
        Please redact any secrets (Bitbucket tokens, app passwords,
        workspace/repo names if sensitive).
      render: shell

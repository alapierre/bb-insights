name: Feature request
description: Suggest an improvement that isn't a new report format
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        For a request to support a brand new input report format (e.g. a
        SARIF-producing tool, a new coverage format, ...), please use the
        [New report format](new_report_format.yml) template instead - it
        fits this project's parser/model/publisher architecture better.

  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: What are you trying to do that bb-insights doesn't currently support?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How would you like this to work? CLI flags, env vars, output format, etc.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any workarounds you're using today, or other approaches you considered.

  - type: checkboxes
    id: scope
    attributes:
      label: Scope check
      description: >
        bb-insights only transforms reports already produced by other tools
        into Bitbucket Code Insights - it does not run tests, generate
        coverage, or perform scanning itself.
      options:
        - label: This request stays within that scope.
          required: true

name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write # for keyless Sigstore signing of the provenance attestations
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Test
        run: go test ./...

      - name: Install syft
        uses: anchore/sbom-action/download-syft@v0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}

      # Attests that the released binary (identified via GoReleaser's own
      # checksums.txt) was built by this exact workflow run, from this exact
      # commit - verifiable with `gh attestation verify`.
      - name: Attest release binary
        uses: actions/attest-build-provenance@v3
        with:
          subject-checksums: dist/checksums.txt

      - name: Resolve published Docker image digest
        id: image
        run: |
          ref=$(jq -r '[.[] | select(.type == "Docker Image")][0].name' dist/artifacts.json)
          digest=$(jq -r '[.[] | select(.type == "Docker Image")][0].extra.Digest' dist/artifacts.json)
          echo "name=index.docker.io/${ref%%:*}" >> "$GITHUB_OUTPUT"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      - name: Attest Docker image
        uses: actions/attest-build-provenance@v3
        with:
          subject-name: ${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.image.outputs.digest }}

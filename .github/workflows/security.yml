name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # New CVEs get published for dependencies you already merged, not just
    # for ones you're actively changing, so this also runs weekly regardless
    # of push/PR activity.
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  govulncheck:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Run govulncheck
        uses: golang/govulncheck-action@v1
        with:
          go-version-file: go.mod
          go-package: ./...
          output-format: sarif
          output-file: govulncheck.sarif

      - name: Upload SARIF to code scanning
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: govulncheck.sarif
          category: govulncheck

  dependency-review:
    # Only meaningful on pull requests: it diffs the dependency graph
    # between the PR's base and head to flag newly introduced vulnerable or
    # disallowed-license dependencies.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Dependency review
        uses: actions/dependency-review-action@v5
